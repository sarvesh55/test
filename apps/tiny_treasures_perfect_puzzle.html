<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f8e8f0">
<title>Tiny Treasures — Photo Puzzle</title>
<style>
:root{--ink:#493444;--muted:#806d7b;--pink:#d95f91;--pink2:#fbe2ec;--line:#ead2de;--paper:#fffafd;--mint:#e4f4ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 5%,#fff 0,#fff8fb 35%,#edf5f8 100%);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
header{text-align:center;padding:17px 12px 7px}
h1{font-size:clamp(23px,4vw,34px);margin:0;color:#a84e77;letter-spacing:.2px}
header p{margin:5px 0;color:var(--muted);font-size:13px}
main{max-width:1080px;margin:auto;padding:10px 14px 28px}
.panel{background:#ffffffd9;border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 12px 32px #8d5d7518}
.controls{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
select,button{font:700 14px system-ui;border:1px solid #e8cbd8;border-radius:12px;padding:10px 13px;background:white;color:#77445d;min-height:42px}
button{cursor:pointer;box-shadow:0 3px 9px #9c668018}
button.primary{background:var(--pink);border-color:var(--pink);color:#fff}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
.stats{display:flex;justify-content:center;gap:clamp(12px,4vw,28px);flex-wrap:wrap;margin:11px 0 8px;color:var(--muted);font-size:13px}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.canvas-wrap{position:relative;width:100%;overflow:hidden;border-radius:15px;background:linear-gradient(145deg,#fff7fb,#f2f7fb);border:1px solid #f0dce5}
canvas{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.tip{text-align:center;font-size:12px;color:var(--muted);padding:9px 3px 1px}
.status{text-align:center;min-height:20px;font-size:13px;color:#a14e76;font-weight:650;margin-top:5px}
.overlay{display:none;position:fixed;inset:0;background:#2d1b28a8;z-index:10;align-items:center;justify-content:center;padding:20px}
.dialog{background:#fffafd;border-radius:22px;padding:26px 22px;text-align:center;max-width:360px;width:100%;box-shadow:0 20px 70px #170b14aa}
.dialog .emoji{font-size:42px}.dialog h2{margin:8px 0;color:#a74470}.dialog p{color:var(--muted);margin:4px 0 18px}
.dialog button{min-width:130px}
@media(max-width:600px){main{padding:7px 8px 20px}.panel{padding:8px;border-radius:16px}.controls{gap:6px}select,button{font-size:12px;padding:9px 10px;min-height:39px}}
</style>
</head>
<body>
<header><h1>🧩 Tiny Treasures</h1><p>Your photo, turned into a little challenge 💗</p></header>
<main>
<section class="panel">
 <div class="controls">
  <select id="level" aria-label="Puzzle difficulty">
   <option value="2">Very easy · 2 × 2</option>
   <option value="3">Easy · 3 × 3</option>
   <option value="4" selected>Medium · 4 × 4</option>
   <option value="5">Hard · 5 × 5</option>
   <option value="6">Expert · 6 × 6</option>
  </select>
  <button class="primary" id="shuffle">🔀 Shuffle pieces</button>
  <button id="preview">👁 Preview</button>
  <button id="restart">↻ Restart</button>
 </div>
 <div class="stats">
  <span>⏱ Time: <b id="time">00:00</b></span>
  <span>Moves: <b id="moves">0</b></span>
  <span>Placed: <b id="placed">0 / 16</b></span>
 </div>
 <div class="canvas-wrap"><canvas id="board" width="900" height="780"></canvas></div>
 <div class="tip">Drag a piece with your finger or mouse. It snaps into place when close enough.</div>
 <div class="status" id="status" aria-live="polite">Choose a level and start solving!</div>
</section>
</main>
<div class="overlay" id="winDialog" role="dialog" aria-modal="true" aria-labelledby="winTitle">
 <div class="dialog"><div class="emoji">🎉💖🧩</div><h2 id="winTitle">Puzzle completed!</h2>
 <p id="winText">You put every piece in the right place.</p>
 <button class="primary" id="playAgain">Play again</button>
 </div>
</div>

const canvas=document.getElementById("board"),ctx=canvas.getContext("2d");
const W=900,H=780, board={x:100,y:40,size:700};
const img=new Image();img.src=PHOTO;
let n=4,pieces=[],drag=null,moves=0,seconds=0,tick=null,preview=false,won=false,gameStarted=false;
const el=id=>document.getElementById(id);
const pad=v=>String(v).padStart(2,"0");
function clock(){el("time").textContent=pad(Math.floor(seconds/60))+":"+pad(seconds%60);}
function crop(){const scale=Math.max(board.size/img.width,board.size/img.height);const w=img.width*scale,h=img.height*scale;return {x:(board.size-w)/2,y:(board.size-h)/2,w,h};}

// A shared edge table guarantees that neighboring tabs and sockets match exactly.
function buildPieces(){
 const horizontal=Array.from({length:n-1},()=>Array.from({length:n},()=>Math.random()<.5?1:-1));
 const vertical=Array.from({length:n},()=>Array.from({length:n-1},()=>Math.random()<.5?1:-1));
 pieces=[];
 for(let r=0;r<n;r++)for(let c=0;c<n;c++){
  pieces.push({r,c,top:r===0?0:-horizontal[r-1][c],right:c===n-1?0:vertical[r][c],
   bottom:r===n-1?0:horizontal[r][c],left:c===0?0:-vertical[r][c-1],x:0,y:0,placed:false});
 }
}
function makePath(p,s,m){
 const x0=m,y0=m,x1=m+s,y1=m+s,pts=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
 const signs=[p.top,p.right,p.bottom,p.left],path=new Path2D();
 path.moveTo(x0,y0);
 for(let k=0;k<4;k++){
  const a=pts[k],b=pts[(k+1)%4],sign=signs[k],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);
  if(!sign){path.lineTo(b[0],b[1]);continue;}
  const tx=dx/len,ty=dy/len,nx=ty,ny=-tx,depth=s*.19;
  const point=(t,off)=>[a[0]+dx*t+nx*off,a[1]+dy*t+ny*off];
  const p1=point(.32,0),p2=point(.39,sign*depth),p3=point(.61,sign*depth),p4=point(.68,0);
  path.lineTo(...p1);
  path.bezierCurveTo(...point(.36,sign*depth*.12),...point(.38,sign*depth),...p2);
  path.bezierCurveTo(...point(.44,sign*depth*1.16),...point(.56,sign*depth*1.16),...p3);
  path.bezierCurveTo(...point(.62,sign*depth),...point(.64,sign*depth*.12),...p4);
  path.lineTo(b[0],b[1]);
 }
 path.closePath();return path;
}
function pieceSize(){return board.size/n;}
function placeScattered(){
 const s=pieceSize(),m=s*.22,full=s+2*m;
 // Scatter positions across the board. The slight overlap is intentional, and the
 // topmost piece is always selected first, so dragging remains predictable.
 const shuffled=[...pieces].sort(()=>Math.random()-.5);
 const cols=Math.ceil(Math.sqrt(pieces.length)),rows=Math.ceil(pieces.length/cols);
 const usableW=board.size-full,usableH=board.size-full;
 shuffled.forEach((p,i)=>{
  const col=i%cols,row=Math.floor(i/cols);
  const cellW=usableW/Math.max(1,cols-1),cellH=usableH/Math.max(1,rows-1);
  p.x=board.x+(cols===1?usableW/2:col*cellW)+(Math.random()-.5)*Math.min(18,cellW*.18);
  p.y=board.y+(rows===1?usableH/2:row*cellH)+(Math.random()-.5)*Math.min(18,cellH*.18);
  p.placed=false;
 });
 pieces=shuffled;
}
function startNewGame(){
 n=Number(el("level").value);buildPieces();placeScattered();
 moves=0;seconds=0;won=false;preview=false;gameStarted=true;
 el("moves").textContent="0";el("placed").textContent="0 / "+pieces.length;
 el("winDialog").style.display="none";el("preview").textContent="👁 Preview";
 el("status").textContent="Drag each piece onto its matching position.";
 clock();clearInterval(tick);tick=setInterval(()=>{if(!won){seconds++;clock();}},1000);draw();
}
function drawPiece(p,selected=false){
 const s=pieceSize(),m=s*.22,full=s+2*m,path=makePath(p,s,m);
 ctx.save();ctx.translate(p.x,p.y);
 ctx.save();ctx.shadowColor=selected?"#43223466":"#43223433";ctx.shadowBlur=selected?13:5;ctx.shadowOffsetY=selected?5:2;
 ctx.fillStyle="#fff";ctx.fill(path);ctx.restore();
 ctx.save();ctx.clip(path);
 const c=crop();
 // Translate the entire photograph relative to this piece. Thus every tile
 // samples the same original image coordinates, including its tab extensions.
 ctx.drawImage(img,board.x+c.x-(board.x+p.c*s-m),board.y+c.y-(board.y+p.r*s-m),c.w,c.h);
 ctx.restore();
 ctx.lineWidth=selected?3:1.8;ctx.strokeStyle=selected?"#b84378":"#fff";ctx.stroke(path);
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#fff8fb");bg.addColorStop(1,"#eef7f8");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#a85c7d";ctx.font="700 17px system-ui";ctx.fillText("PUT THE PICTURE BACK TOGETHER",board.x,25);
 ctx.fillStyle="#fff";ctx.shadowColor="#b47c9650";ctx.shadowBlur=15;ctx.fillRect(board.x,board.y,board.size,board.size);ctx.shadowBlur=0;
 ctx.strokeStyle="#e7c6d5";ctx.lineWidth=3;ctx.strokeRect(board.x,board.y,board.size,board.size);
 const s=pieceSize();
 if(preview){ctx.save();ctx.globalAlpha=.17;const c=crop();ctx.drawImage(img,board.x+c.x,board.y+c.y,c.w,c.h);ctx.restore();}
 // Faint target cells provide a visual guide without obscuring the photo.
 ctx.save();ctx.strokeStyle="#d8b8c7";ctx.lineWidth=1;ctx.setLineDash([5,6]);
 for(let i=1;i<n;i++){ctx.beginPath();ctx.moveTo(board.x+i*s,board.y);ctx.lineTo(board.x+i*s,board.y+board.size);ctx.stroke();ctx.beginPath();ctx.moveTo(board.x,board.y+i*s);ctx.lineTo(board.x+board.size,board.y+i*s);ctx.stroke();}
 ctx.restore();
 pieces.filter(p=>p.placed).forEach(p=>drawPiece({...p,x:board.x+p.c*s-s*.22,y:board.y+p.r*s-s*.22}));
 pieces.filter(p=>!p.placed&&p!==drag?.p).forEach(p=>drawPiece(p));
 if(drag)drawPiece(drag.p,true);
 // Border and tiny corner ornaments
 ctx.strokeStyle="#e9b9ce";ctx.lineWidth=2;ctx.strokeRect(board.x-5,board.y-5,board.size+10,board.size+10);
}
function pointerPos(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function hit(p,q){
 const s=pieceSize(),m=s*.22,full=s+2*m;
 return q.x>=p.x-3&&q.x<=p.x+full+3&&q.y>=p.y-3&&q.y<=p.y+full+3;
}
canvas.addEventListener("pointerdown",e=>{
 if(won||!img.complete)return;const q=pointerPos(e);
 for(let i=pieces.length-1;i>=0;i--){const p=pieces[i];if(!p.placed&&hit(p,q)){
  drag={p,dx:q.x-p.x,dy:q.y-p.y};pieces.splice(i,1);pieces.push(p);
  canvas.setPointerCapture(e.pointerId);draw();e.preventDefault();return;
 }}
});
canvas.addEventListener("pointermove",e=>{if(!drag)return;const q=pointerPos(e);drag.p.x=q.x-drag.dx;drag.p.y=q.y-drag.dy;draw();e.preventDefault();});
function drop(){
 if(!drag)return;
 const p=drag.p,s=pieceSize(),m=s*.22;
 const targetX=board.x+p.c*s-m,targetY=board.y+p.r*s-m;
 moves++;el("moves").textContent=String(moves);
 // Snap based on piece origin, not pointer position: avoids the offset bug in
 // the earlier build and works regardless of where the user grabs the piece.
 if(Math.hypot(p.x-targetX,p.y-targetY)<s*.38){
  p.x=targetX;p.y=targetY;p.placed=true;
  const count=pieces.filter(x=>x.placed).length;el("placed").textContent=count+" / "+pieces.length;
  el("status").textContent="Nice! "+count+" of "+pieces.length+" pieces placed.";
 }
 drag=null;draw();
 if(pieces.every(x=>x.placed))finish();
}
canvas.addEventListener("pointerup",drop);
canvas.addEventListener("pointercancel",drop);
function finish(){
 won=true;clearInterval(tick);el("status").textContent="Every piece is in place — beautiful work!";
 el("winText").textContent="Completed in "+pad(Math.floor(seconds/60))+":"+pad(seconds%60)+" with "+moves+" moves.";
 el("winDialog").style.display="flex";
 // Also provide the requested clear success alert for devices where the dialog is missed.
